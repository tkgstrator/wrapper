name: build

on:
  push:
    branches: [master]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      apk_url:
        description: 'Signed URL to an Apple Music .apk or .apkm (overrides APK_URL secret; required if the secret is not set).'
        required: false
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/wrapper

jobs:
  build:
    name: build (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            oci_arch: amd64
            runner: ubuntu-latest
            docker_platform: linux/amd64
          - arch: arm64-v8a
            oci_arch: arm64
            runner: ubuntu-latest
            docker_platform: linux/arm64

    env:
      # workflow_dispatch input wins (signed URLs are short-lived, so the maintainer
      # pastes one per run); otherwise fall back to the long-lived APK_URL secret.
      APK_URL: ${{ inputs.apk_url || secrets.APK_URL }}

    steps:
      - uses: actions/checkout@v4

      # linux/arm64 images need binfmt/qemu to execute on GHA amd64 runners (smoke test).
      - name: Set up QEMU
        if: matrix.docker_platform != 'linux/amd64'
        uses: docker/setup-qemu-action@v3

      - name: Install host tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            jq unzip curl ca-certificates

      - name: Validate Compose config
        run: docker compose config --quiet

      # act injects Node from outside the runner image. Preserve its directory
      # before the Rust action prepends CARGO_HOME to PATH, otherwise later
      # JavaScript actions (such as docker/login-action) cannot find Node.
      - name: Preserve Node for act
        if: ${{ env.ACT }}
        run: echo "$(dirname "$(command -v node)")" >> "$GITHUB_PATH"

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust unit tests
        run: cargo test --locked

      - name: Make scripts executable
        run: chmod +x tools/extract-libs.sh tools/stage-system.sh

      # LOCAL_APK_PATH is an escape hatch for local `act` runs: point it at an
      # .apk/.apkm already on disk and APK_URL plus the download are skipped.
      # It is never set on GitHub-hosted runs, so the URL path stays the default.
      - name: Resolve Apple Music artifact
        run: |
          mkdir -p .tmp

          if [[ -n "${LOCAL_APK_PATH}" ]]; then
            if [[ ! -f "${LOCAL_APK_PATH}" ]]; then
              echo "::error::LOCAL_APK_PATH is set to '${LOCAL_APK_PATH}' but that file does not exist."
              echo "With act, pass a path relative to the repo root and run with --bind (-b),"
              echo "because .tmp/ and *.apk/*.apkm are gitignored and are not copied otherwise."
              exit 1
            fi
            case "${LOCAL_APK_PATH,,}" in
              *.apk)  artifact=".tmp/apple-music.apk" ;;
              *.apkm) artifact=".tmp/apple-music.apkm" ;;
              *)
                echo "::error::LOCAL_APK_PATH must end in .apk or .apkm (got '${LOCAL_APK_PATH}')."
                exit 1
                ;;
            esac
            # LOCAL_APK_PATH may already BE the normalized path (the README's act
            # example points straight at .tmp/). -ef compares device+inode, so it
            # also catches symlinks and hard links; GNU cp would abort with
            # "are the same file".
            if [[ "${LOCAL_APK_PATH}" -ef "${artifact}" ]]; then
              echo "Local artifact is already at ${artifact}; using it in place."
            else
              cp "${LOCAL_APK_PATH}" "${artifact}"
              echo "Using local artifact: ${LOCAL_APK_PATH} -> ${artifact}"
            fi
          else
            if [[ -z "${APK_URL}" ]]; then
              echo "::error::APK_URL is not set."
              echo "On workflow_dispatch: paste a signed .apk/.apkm URL into the apk_url input."
              echo "On push (master / v* tag): set the APK_URL repository secret."
              echo "Locally with act: set LOCAL_APK_PATH to an .apk/.apkm in the repo."
              exit 1
            fi
            artifact=".tmp/apple-music.apk"
            if [[ "${APK_URL,,}" == *.apkm* ]]; then
              artifact=".tmp/apple-music.apkm"
            fi
            curl -fL --retry 3 --retry-delay 2 -o "${artifact}" "${APK_URL}"
          fi

          echo "APPLE_MUSIC_ARTIFACT=${artifact}" >> "$GITHUB_ENV"

      - name: Extract Apple native libs
        run: |
          ./tools/extract-libs.sh \
            --bundle "${APPLE_MUSIC_ARTIFACT}" \
            --arch ${{ matrix.arch }}

      - name: Stage Android system binaries
        run: |
          ./tools/stage-system.sh --arch ${{ matrix.arch }}

      - name: Compute image tag
        id: image
        run: |
          ref="${REGISTRY}/${IMAGE_NAME}:${{ github.sha }}-${{ matrix.oci_arch }}"
          echo "ref=${ref}" >> "$GITHUB_OUTPUT"

      - name: Build Docker image
        run: |
          docker build \
            --build-arg BUILD_PLATFORM=${{ matrix.docker_platform }} \
            --build-arg RUNTIME_PLATFORM=${{ matrix.docker_platform }} \
            --build-arg TARGET_ARCH=${{ matrix.arch }} \
            --provenance=false \
            -t "${{ steps.image.outputs.ref }}" \
            .

      - name: Smoke test (HTTP and TCP)
        run: |
          # No --rm: if the app exits immediately, Docker removes --rm containers
          # and a later docker stop hits "No such container".
          docker rm -f wrapper-smoke 2>/dev/null || true
          # Match compose.yaml: AppArmor default profile can deny mount(2) (urandom
          # bind) even with CAP_SYS_ADMIN; SYS_PTRACE matches production caps.
          docker run -d \
            --platform ${{ matrix.docker_platform }} \
            --name wrapper-smoke \
            --cap-add SYS_ADMIN --cap-add SYS_CHROOT --cap-add SYS_PTRACE \
            --security-opt apparmor=unconfined \
            -p 8080:80 \
            -p 11020:10020 \
            "${{ steps.image.outputs.ref }}"
          http_ok=0
          for i in $(seq 1 40); do
            if curl -sf http://127.0.0.1:8080/health >/dev/null; then
              echo "health OK after ${i} attempt(s)"
              http_ok=1
              break
            fi
            sleep 0.5
          done
          if [[ "$http_ok" != "1" ]]; then
            echo "::error::health did not become ready in time"
            docker logs wrapper-smoke 2>&1 || true
            docker rm -f wrapper-smoke 2>/dev/null || true
            exit 1
          fi
          curl -sf http://127.0.0.1:8080/health | jq .

          tcp_ok=0
          for i in $(seq 1 20); do
            if timeout 2 bash -c '</dev/tcp/127.0.0.1/11020' 2>/dev/null; then
              echo "TCP decrypt listener OK after ${i} attempt(s)"
              tcp_ok=1
              break
            fi
            sleep 0.5
          done
          if [[ "$tcp_ok" != "1" ]]; then
            echo "::error::TCP decrypt listener did not accept connections in time"
            docker logs wrapper-smoke 2>&1 || true
            docker rm -f wrapper-smoke 2>/dev/null || true
            exit 1
          fi
          docker rm -f wrapper-smoke

      # Push only when the ref is master or a v* tag — fires for push events and for
      # workflow_dispatch runs targeted at one of those refs. Manual runs from feature
      # branches build + smoke only.
      - name: Log in to GHCR
        if: |
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
          (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v'))
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push per-arch image to GHCR
        if: |
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
          (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v'))
        run: |
          docker push "${{ steps.image.outputs.ref }}"

  manifest:
    name: manifest (multi-arch)
    needs: build
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v'))

    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push multi-arch manifest
        run: |
          image="${REGISTRY}/${IMAGE_NAME}"
          src_amd64="${image}:${{ github.sha }}-amd64"
          src_arm64="${image}:${{ github.sha }}-arm64"

          # Always tag the immutable commit sha.
          tags=( "--tag" "${image}:${{ github.sha }}" )

          # master push -> :latest
          if [[ "${{ github.ref }}" == "refs/heads/master" ]]; then
            tags+=( "--tag" "${image}:latest" )
          fi

          # v* tag push -> :<tag-name> (e.g. v1.2.3)
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            tags+=( "--tag" "${image}:${{ github.ref_name }}" )
          fi

          docker buildx imagetools create "${tags[@]}" "${src_amd64}" "${src_arm64}"
